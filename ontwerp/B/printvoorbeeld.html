<!doctype html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<title>Richtprijs-AI · afdrukvoorbeeld</title>
<!-- Hulpbestand voor de schermafbeelding print.png: laadt index.html in een kader van A4-breedte en zet de @media print-regels aan als gewone regels. -->
<style>html,body{margin:0;background:#9a968d}iframe{display:block;width:794px;height:2400px;border:0;background:#fff;margin:0 auto}
/* Paginagrenzen van A4 (1123 px) bij 14 mm boven- en 16 mm ondermarge: een streep per nieuwe pagina. */
#paginas{position:absolute;left:50%;top:53px;width:794px;height:2400px;margin-left:-397px;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0,transparent 1009px,#c0392b 1009px,#c0392b 1010px)}</style>
</head>
<body>
<iframe id="k" src="index.html"></iframe>
<div id="paginas"></div>
<script>
document.getElementById('k').addEventListener('load', function () {
  var doc = this.contentDocument;
  var regels = [];
  for (var i = 0; i < doc.styleSheets.length; i++) {
    var lijst;
    try { lijst = doc.styleSheets[i].cssRules; } catch (e) { continue; }
    for (var j = 0; j < lijst.length; j++) {
      var r = lijst[j];
      if (r.type === CSSRule.MEDIA_RULE && r.media.mediaText === 'print') {
        for (var k = 0; k < r.cssRules.length; k++) regels.push(r.cssRules[k].cssText);
      }
    }
  }
  var s = doc.createElement('style');
  s.textContent = regels.join('\n') + '\nbody{padding:14mm}';
  doc.head.appendChild(s);
});
</script>
</body>
</html>
