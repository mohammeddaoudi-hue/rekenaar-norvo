<!doctype html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meetbeeld test</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../meetbeeld.css">
<style>
body{margin:0;background:#f4f1e8;font-family:'IBM Plex Sans',system-ui,sans-serif;padding:24px;display:grid;gap:24px;grid-template-columns:1fr 1fr;max-width:1100px}
#groot{grid-column:1/-1;max-width:560px}
#klein{max-width:240px}
p{margin:0;color:#56514a;font-size:14px}
</style>
</head>
<body>
<div id="groot"></div>
<div id="klein"></div>
<p id="uit">Meten…</p>
<script src="../meetbeeld.js"></script>
<script>
(async () => {
  const adres = new URLSearchParams(location.search).get('adres') || 'August van Landeghemstraat 63 Willebroek';
  const r = await fetch('/api/adres?q=' + encodeURIComponent(adres), { headers: { 'x-richtprijs': '1' } });
  const g = await r.json();
  if (!r.ok) { document.getElementById('uit').textContent = g.fout; return; }
  Meetbeeld.teken(document.getElementById('groot'), g, { px: 800, animatie: !location.hash.includes('stil') });
  Meetbeeld.teken(document.getElementById('klein'), g, { px: 400, animatie: false, compact: true });
  document.getElementById('uit').textContent = JSON.stringify({ contour: g.beeld.contour.length, buren: g.beeld.buren.length, andere: g.beeld.andere.length, cellen: g.beeld.cellen.length, maten: g.beeld.maten.map((m) => m.naam + ' ' + m.waarde) });
})();
</script>
</body>
</html>
